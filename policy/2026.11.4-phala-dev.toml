# Release policy drafted 2026-11-27T10:54Z by demo/live/bootstrap-policy.sh from https://vault.example.com.
# MRTD/RTMR0-2 were observed from the live quote and INDEPENDENTLY REPRODUCED
# with dstack-mr (built at dstack 350a0a73) from the published image
# dstack-0.6.5.tar.gz (sha256 f33965e0…, os_image_hash 4771a29e…, GitHub
# release mkosi-os-v0.6.5) for VM shape cpu=1, memory=2G, qemu 8.2.2,
# hotplug_off=false (Phala tdx.small; the shape in the served vm_config).
# All four match (same values as 2026.11.0 to 2026.11.2): this release
# supports claim C2.
# Transcript: policy/2026.11.4-phala-dev.reproduce.txt
#   policy/measure/measure-tdx.sh dstack-0.6.5.tar.gz <sha256> <os_image_hash> \
#     --cpu 1 --memory 2G --qemu-version 8.2.2 --policy <this file> -- --hotplug-off false
# Development release, same CVM and app id as 2026.11.2-phala-dev. Changes in
# the measured app-compose (diff against policy/2026.11.2-phala-dev.app-compose.json):
#   * sidecar image rebuilt from commit 9f723df (per-client rate limit etc.;
#     attest-sidecar/reproducible-build.sh 9f723df gives the pinned digest);
#   * TLS certificates and keys on a tmpfs volume (caddy_certs): a new key
#     and certificate at every boot, nothing of them on the data disk;
#   * Vaultwarden CONFIG_FILE on a tmpfs (a planted /data/config.json is ignored);
#   * Access-Control-Allow-Origin on the attestation route (browser verifier);
#   * Caddyfile config named caddyfile_<rev>;
#   * pre-launch script: removes containers and networks left on the data
#     disk before compose starts, then the GHCR login (D-049).
# New pins in this policy: public_logs, tdx.min_tcb_eval_data_number (the
# number observed at drafting time), tdx.mr_config_id (observed; version 3
# form, 0x03 ‖ 32 bytes, which the verifier cannot recompute and therefore
# pins by value).
# DNS / WebPKI state at release time (DECISIONS D-052): vault.example.com is
# an A record with its own CAA set (issue letsencrypt.org, accounturi =
# the in-CVM ACME account 4048885521, validationmethods=tls-alpn-01;
# issuewild ";"). Cloudflare Universal SSL was turned off for example.com
# on 2026-11-27, but 5 earlier Cloudflare wildcard certificates
# (*.example.com, keys held by Cloudflare) remain valid until they expire
# (about January 2027), and the zone apex has no CAA record, so wildcard
# issuance for *.example.com is not restricted (demo/live/caa-check-vault.expected.txt,
# demo/live/ct-check.expected.txt: both FAIL for that reason).
# Still not for real users: logs on (public_logs = true), SMT / dynamic
# platform / cached keys accepted, and the persistent-state precondition of
# docs/THREAT_MODEL.md section 1 (the data disk was written by earlier
# releases of the same app id).
# TCB status / advisories at drafting time: UpToDate
# Reviewed app-compose: policy/2026.11.4-phala-dev.app-compose.json
