# RELAY ATTACKER for the local e2e test: a different TLS endpoint (own key,
# own local CA) that forwards the attestation request to the real sidecar.
# The verifier must FAIL on the TLS key binding.
name: avw-relay

services:
  relay:
    image: docker.io/library/caddy@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    ports:
      - "127.0.0.1:9443:443"
    networks: [victim]
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - relay_data:/data

networks:
  victim:
    name: avw-local_default
    external: true

configs:
  caddyfile:
    content: |
      {
        admin off
        skip_install_trust
        auto_https disable_redirects
      }
      localhost {
        tls internal
        reverse_proxy attest:8081
      }

volumes:
  relay_data:
