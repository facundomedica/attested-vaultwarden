# RELAY ATTACKER against a live deployment: a local TLS endpoint with its own
# key forwards attestation requests to the real server. The verifier must
# fail on the TLS key binding. Upstream set by relay-live.sh.
name: avw-relay-live
services:
  relay:
    image: docker.io/library/caddy@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    ports: ["127.0.0.1:9443:443"]
    environment:
      UPSTREAM: "${UPSTREAM:?}"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes: [relay_data:/data]
configs:
  caddyfile:
    content: |
      {
        admin off
        skip_install_trust
        auto_https disable_redirects
      }
      localhost {
        tls internal
        reverse_proxy https://{$$UPSTREAM} {
          header_up Host {$$UPSTREAM}
        }
      }
volumes:
  relay_data:
