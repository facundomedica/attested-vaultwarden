[package]
name = "attested-vw-web"
description = "Browser (WebAssembly) build of the Attested Vaultwarden verifier core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
attested-vw-common.workspace = true
# The pure core only: no TLS client, no HTTP client, no RNG, no SEV-SNP.
attested-vw-verify = { path = "../../verifier", default-features = false }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
anyhow = "1"
# `report` is the collateral client; on wasm it only compiles with `js`
# (which also turns on getrandom's browser backend for its dependencies).
dcap-qvl = { version = "0.7.1", default-features = false, features = ["std", "rustcrypto", "default-x509", "report", "js"] }
js-sys = "0.3"
wasm-bindgen = "=0.2.130" # must equal the wasm-bindgen CLI version in web/build.sh
wasm-bindgen-futures = "0.4"

# Not the workspace lints: `unsafe_code = "forbid"` cannot be combined with
# the code `#[wasm_bindgen]` generates. No unsafe is written by hand here.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
