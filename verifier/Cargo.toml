[package]
name = "attested-vw-verify"
description = "Standalone verifier for Attested Vaultwarden deployments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "attested_vw_verifier"
path = "src/lib.rs"

[[bin]]
name = "attested-vw-verify"
path = "src/main.rs"

[dependencies]
attested-vw-common.workspace = true
base64.workspace = true
dcap-qvl = { version = "0.7.1", default-features = false, features = ["std", "rustcrypto", "default-x509", "report"] }
bytes = "1"
clap.workspace = true
getrandom = "0.3"
hex.workspace = true
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
sev = { version = "9.0.0", default-features = false, features = ["snp", "crypto_nossl"] }
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
x509-parser = { version = "0.18", default-features = false }

[dev-dependencies]
# Signs SYNTHETIC SNP reports in tests (already in the tree via `sev`).
p384 = { version = "0.13", default-features = false, features = ["ecdsa"] }

[lints]
workspace = true
