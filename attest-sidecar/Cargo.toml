[package]
name = "attest-sidecar"
description = "Attestation sidecar for Attested Vaultwarden: serves TEE evidence bound to the TLS key"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Dependencies are kept to the minimum: this binary runs inside the TEE and is
# part of what users trust.
[dependencies]
attested-vw-common.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
base64.workspace = true
bytes = "1"
hex.workspace = true
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
time = { version = "0.3", features = ["formatting"] }
tokio.workspace = true

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
